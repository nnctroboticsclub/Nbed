# Nbed 開発環境（NUCLEO-F446RE）

[platformio]
description = Nbed library development and hardware examples
default_envs = f4-blink
src_dir = examples
build_dir = build
build_cache_dir = .cache

; -----------------------------------------------------------------------------
; NUCLEO-F446RE 向け共通設定
; -----------------------------------------------------------------------------
[env]
platform = ststm32@20.0.0
framework = stm32cube
board = nucleo_f446re
platform_packages =
  toolchain-gccarmnoneeabi@1.140201.0
  framework-stm32cubef4@1.28.3
board_build.stm32cube.custom_config_header = yes
; Build the library in this checkout, without copying or downloading Nbed.
lib_deps = Nbed=symlink://.
extra_scripts = pre:scripts/compiledb.py
upload_protocol = stlink
monitor_speed = 921600
monitor_filters = direct


# Nbedテスト環境 - F4全機能
[env:00-f4-all-test]
build_src_filter = -<*> +<${this.__env__}/>
build_flags = 
  -DNBED_NO_DEFAULT_SERIAL

# Nbedテスト環境 - F4デジタル入出力テスト
[env:01-f4-digital-test]
build_src_filter = -<*> +<${this.__env__}/>

# Nbedテスト環境 - F4アナログ入出力テスト
[env:02-f4-analog-test]
build_src_filter = -<*> +<${this.__env__}/>

# Nbedテスト環境 - F4PWMテスト
[env:03-f4-pwm-test]
build_src_filter = -<*> +<${this.__env__}/>

# Nbedテスト環境 - F4UARTテスト
[env:04-f4-uart-test]
build_src_filter = -<*> +<${this.__env__}/>
build_flags = 
  -DNBED_NO_DEFAULT_SERIAL

# Nbedテスト環境 - F4CANテスト
[env:05-f4-can-test]
build_src_filter = -<*> +<${this.__env__}/>

# Nbed コード例
[env:06-f4-nbed-example]
build_src_filter = -<*> +<${this.__env__}/>

; Board LED only; no external wiring is required.
[env:f4-blink]
build_src_filter = -<*> +<${this.__env__}/>
